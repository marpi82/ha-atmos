name: Codecov

# CI on a fork cannot read CODECOV_TOKEN, and tokenless uploads do not report
# codecov/patch on protected branches. This workflow runs from the base branch
# after CI and only uploads the coverage artifact. It checks the pull request
# out so Codecov can map report paths, and it does not execute that code.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  upload:
    name: Upload coverage
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check tests job
        id: tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          conclusion="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name=="tests (3.13)") | .conclusion')"
          if [[ -z "$conclusion" ]]; then
            echo "tests (3.13) job not found on run ${RUN_ID}" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$conclusion" | wc -l)" -ne 1 ]]; then
            echo "expected one tests job, got: ${conclusion}" >&2
            exit 1
          fi
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      # The uploader needs this tree or it discards the report. The pinned
      # checkout refuses a fork head from workflow_run unless this opt-in is
      # set. Nothing from the pull request is executed. Symlinks are removed
      # so a fork cannot redirect later writes or the uploader, and the
      # artifact is saved outside the checkout.
      - name: Check out the pull request commit
        if: steps.tests.outputs.conclusion == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Drop fork symlinks and use the base Codecov config
        if: steps.tests.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # -delete implies -depth, which disables -prune and makes find exit 1.
          find . -path ./.git -prune -o -type l -exec rm -f {} +
          rm -f codecov.yml
          gh api "repos/${GITHUB_REPOSITORY}/contents/codecov.yml?ref=${DEFAULT_BRANCH}" --jq .content | base64 -d > codecov.yml

      - name: Download coverage
        if: steps.tests.outputs.conclusion == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pull request
        id: pr
        if: steps.tests.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          owner="${HEAD_REPO%%/*}"
          if [[ -z "$owner" || -z "$HEAD_BRANCH" || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_run is missing a usable head repository, branch, or sha" >&2
            exit 1
          fi
          number="$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "head=${owner}:${HEAD_BRANCH}" \
            -f state=open \
            --jq ".[] | select(.head.sha==\"${HEAD_SHA}\") | .number")"
          if [[ -z "$number" ]]; then
            echo "No open pull request for ${owner}:${HEAD_BRANCH} at ${HEAD_SHA}" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$number" | wc -l)" -ne 1 || ! "$number" =~ ^[0-9]+$ ]]; then
            echo "Expected one pull request number for ${HEAD_SHA}, got: ${number}" >&2
            exit 1
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: steps.tests.outputs.conclusion == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ${{ runner.temp }}/coverage/coverage.xml
          disable_search: true
          flags: unittests
          name: ha-atmos
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_pr: ${{ steps.pr.outputs.number }}
          # workflow_run has GITHUB_REF on the default branch and an empty
          # GITHUB_HEAD_REF, so Codecov would file this report under main.
          override_branch: ${{ github.event.workflow_run.head_branch }}
