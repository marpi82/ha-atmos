name: HACS Validation

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hacs-validation:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HACS Validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

      - name: Validate HACS info file
        run: |
          python -c "import json; json.load(open('hacs.json'))"
          test -f custom_components/atmos/manifest.json
          test -f custom_components/atmos/__init__.py
          test -f README.md
