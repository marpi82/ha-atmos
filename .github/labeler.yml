documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - CHANGELOG.md
          - CONTRIBUTING.md
          - SECURITY.md
          - AGENTS.md
          - .github/*.md
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

testing:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

python:
  - changed-files:
      - any-glob-to-any-file:
          - custom_components/**
          - scripts/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
