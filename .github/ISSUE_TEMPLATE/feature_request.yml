name: Feature request
description: Propose a new capability or improvement for ha-atmos.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Focus on the **user / HA integration need**; implementation details can come later.

        Breaking changes to config-entry keys or `unique_id` values affect existing Home Assistant installs — call that out explicitly.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
      placeholder: As an HA integration author, I need …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API or behavior you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Public API impact
      options:
        - No — additive / internal only
        - Yes — additive public API (new symbols / optional args)
        - Yes — breaking change to documented public API
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Config flow
        - Source selection (`source.py` / `runtime.py`)
        - Entities
        - Feed / ValueStore / EventBus
        - Docs
        - CI / packaging
        - Other / unsure
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues / docs for similar requests.
          required: true
        - label: I am willing to help implement this (optional).
          required: false
