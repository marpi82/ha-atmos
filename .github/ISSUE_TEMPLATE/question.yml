name: Question
description: Ask how something works, or whether observed behavior is intended.
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer this when you are unsure whether something is a bug.

        For setup help, see [CONTRIBUTING.md](https://github.com/marpi82/ha-atmos/blob/main/CONTRIBUTING.md) and [AGENTS.md](https://github.com/marpi82/ha-atmos/blob/main/AGENTS.md).

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant code, versions, adapter, and baud rate. Do not paste a live bus capture that includes private data.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched issues and the docs before asking.
          required: true
