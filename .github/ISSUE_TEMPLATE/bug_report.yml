name: Bug report
description: Something is broken or behaves unexpectedly in ha-atmos.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Security issues must not be filed here.** Use [private vulnerability reporting](https://github.com/marpi82/ha-atmos/security/advisories/new) or email `marpi82.dev@google.com` (see [SECURITY.md](https://github.com/marpi82/ha-atmos/blob/main/SECURITY.md)).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
      placeholder: e.g. AtmosSerialFeed publishes a register value from undecoded bytes.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages / traceback if any).
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Say whether RS485, WG1000, or both were configured.
      placeholder: |
        1. …
        2. …
        3. …
      render: markdown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - ha-atmos version / git SHA / HACS:
        - Python version:
        - Gateway firmware (if known):
        - OS:
        - Home Assistant version (if relevant):
        - Installation (HACS / manual / other):
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Config flow
        - Source selection (`source.py` / `runtime.py`)
        - WG1000 pull (`wiring.py`)
        - Feed / ValueStore / EventBus
        - Docs
        - CI / packaging / HACS
        - Other / unsure
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I can reproduce this offline with captured frames / fixtures when practical.
          required: false
