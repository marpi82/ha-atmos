minimum_pre_commit_version: "4.3.0"

exclude: |
  (?x)^(
    dist/|
    build/
  )

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        files: ^(custom_components/atmos/(source|runtime|const)\.py|tests/)
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (protect staged)
        entry: gitleaks protect --staged --redact
        language: golang
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (scan custom_components/)
        args: ["-r", "custom_components", "-q", "-ll"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-pre-push
        name: pytest (coverage gates on push)
        language: system
        entry: bash scripts/check_patch_coverage.sh
        pass_filenames: false
        stages: [pre-push]
